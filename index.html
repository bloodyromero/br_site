<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Илья Коростелёв</title>

    <!-- Подключение шрифта Rubik Dirt с Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&display=swap" rel="stylesheet">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            overflow: hidden;
        }

        /* ====== ДЕСКТОПНАЯ ВЕРСИЯ (по умолчанию) ====== */
        header {
            text-align: center;
            padding: 15px 0;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
            pointer-events: none;
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 8px;
            display: inline-block;
            pointer-events: auto;
        }
        h1 {
            margin: 0;
            font-family: 'Rubik Dirt', system-ui;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 2px;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .block {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 0 10px;
        }
        @media (hover: hover) and (pointer: fine) {
            .block:hover {
                flex: 2.5;
            }
        }
        .musician { 
            background-image: url('main_left_1.png'); 
            background-size: cover;
            background-position: center;
        }
        .arranger { 
            background-image: url('center_1.png'); 
            background-size: cover;
            background-position: center;
        }
        .teacher { 
            background-image: url('main_right_1.png'); 
            background-size: cover;
            background-position: center;
        }
        .block::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.6));
            pointer-events: none;
        }
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 15px 0 20px 0;
            z-index: 10;
            pointer-events: none;
        }
        footer p {
            margin: 0;
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
            padding: 0 20px;
        }

        /* ====== МОБИЛЬНАЯ ВЕРСИЯ ====== */
        @media (max-width: 768px) {
            body, html {
                height: 100%;
                overflow: hidden;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            header {
                position: static;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
                gap: 12px;
                padding: 12px 15px;
                background-color: #111;
                flex-shrink: 0;
            }
            .avatar {
                width: 50px;
                height: 50px;
                border-width: 2px;
                margin-bottom: 0;
                flex-shrink: 0;
            }
            h1 {
                font-size: 1.5rem;
                letter-spacing: 1px;
                text-align: left;
            }
            .container {
                flex: 1;
                flex-direction: column;
                height: auto;
                min-height: 0;
            }
            .block {
                font-size: 1.4rem;
            }
            footer {
                position: static;
                background-color: #111;
                padding: 15px 15px 18px 15px;
                flex-shrink: 0;
            }
            footer p {
                font-size: 0.8rem;
                padding: 0;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>
    <header>
        <img src="avatar.png" alt="Илья Коростелёв" class="avatar">
        <h1>Илья Коростелёв</h1>
    </header>
    <div class="container">
        <div class="block musician">Музыкант</div>
        <div class="block arranger">Аранжировщик</div>
        <div class="block teacher">Преподаватель</div>
    </div>
    <footer>
        <p id="slogan-text"></p>
    </footer>
    <script>
        const slogans = [
            "Играю, аранжирую, учу. Иногда даже одновременно. Обычно — нет.",
            "Музыкант, аранжировщик, преподаватель. И да, я всё ещё жду, когда это станет прибыльным.",
            "Три пути, один человек. Выбирайте, но учтите: я всё равно буду вас учить, аранжировать и играть.",
            "Сайт собран на коленке. Как и большинство моих аранжировок. Но зато с душой.",
            "Здесь могла быть ваша реклама. Но я музыкант, а не маркетолог.",
            "Музыка — это не работа. Это диагноз.",
            "Этот сайт существует. Как и моя карьера. Пока что.",
            "Сделал сайт сам. Ну как сам — нейросеть помогала. Но идея моя. Честно.",
            "Музыкант, аранжировщик, преподаватель. А ещё умею печь хлеб.",
            "Синтез звука — это магия. Только с проводами и без жертвоприношений.",
            "Преподаватель, аранжировщик, музыкант. Три профессии, одна зарплата. Шучу. Зарплаты нет."
        ];
        document.getElementById('slogan-text').textContent = 
            slogans[Math.floor(Math.random() * slogans.length)];
    </script>
</body>
</html>
