<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloody Romero</title>

    <style>
        @font-face {
            font-family: 'TagType';
            src: url('tagtype.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Strogo';
            src: url('strogo.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            overflow: hidden;
        }

        /* ====== ДЕСКТОПНАЯ ВЕРСИЯ ====== */
        header {
            position: absolute;
            width: 100%;
            top: 0;
            padding: 20px 40px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* --- Профиль (по центру) --- */
        .profile-block {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 16px;
            pointer-events: auto;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            box-shadow: none;
            outline: none;
            background: transparent;
            display: inline-block;
            flex-shrink: 0;
        }
        .title-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
        }
        h1 {
            margin: 0;
            font-family: 'TagType', system-ui;
            font-size: 2.4rem;
            font-weight: normal;
            letter-spacing: 2px;
            line-height: 1.1;
            text-align: left;
        }
        .subtitle {
            margin: 10px 0 0 0;
            font-family: 'Strogo', system-ui;
            font-size: 1.1rem;
            font-weight: normal;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.85);
            text-align: left;
            text-transform: uppercase;
        }

        /* --- Соцсети (абсолютно справа) --- */
        .social-links {
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
        }
        .social-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            border: none;
            cursor: pointer;
            transition: transform 0.25s ease, filter 0.25s ease;
            display: block;
        }
        .social-icon:hover {
            transform: scale(1.12);
            filter: brightness(1.3);
        }

        /* --- Блоки --- */
        .container {
            display: flex;
            height: 100vh;
            width: 100%;
        }
        .block {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            transition: flex 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
            text-align: center;
            padding: 0 10px;
        }
        @media (hover: hover) and (pointer: fine) {
            .block:hover {
                flex: 2.5;
            }
        }
        .musician { 
            background-image: url('main_left_1.png'); 
            background-size: cover;
            background-position: center;
        }
        .arranger { 
            background-image: url('center_1.png'); 
            background-size: cover;
            background-position: center;
        }
        .teacher { 
            background-image: url('main_right_1.png'); 
            background-size: cover;
            background-position: center;
        }
        .block::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.6));
            pointer-events: none;
        }

        /* --- Футер --- */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 15px 0 20px 0;
            z-index: 10;
            pointer-events: none;
            box-sizing: border-box;
        }
        footer p {
            margin: 0 auto;
            font-size: 0.95rem;
            font-style: italic;
            letter-spacing: 1px;
            color: rgba(255, 255, 255, 0.85);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.95);
            padding: 0 40px;
            text-align: center;
            max-width: 100%;
            box-sizing: border-box;
            overflow-wrap: break-word;
            word-wrap: break-word;
            line-height: 1.4;
        }

        /* ====== МОБИЛЬНАЯ ВЕРСИЯ ====== */
        @media (max-width: 768px) {
            body, html {
                height: 100%;
                overflow: hidden;
            }
            body {
                display: flex;
                flex-direction: column;
            }
            header {
                position: static;
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 10px 12px;
                background-color: #111;
                flex-shrink: 0;
                width: 100%;
                box-sizing: border-box;
            }
            .profile-block {
                gap: 10px;
            }
            .avatar {
                width: 50px;
                height: 50px;
                border: none;
                box-shadow: none;
                outline: none;
            }
            h1 {
                font-size: 1.35rem;
                letter-spacing: 1px;
            }
            .subtitle {
                font-size: 0.7rem;
                letter-spacing: 1.5px;
                margin-top: 5px;
            }
            .social-links {
                position: static;
                transform: none;
                gap: 8px;
            }
            .social-icon {
                width: 36px;
                height: 36px;
            }
            .container {
                flex: 1;
                flex-direction: column;
                height: auto;
                min-height: 0;
            }
            .block {
                font-size: 1.4rem;
            }
            footer {
                position: static;
                background-color: #111;
                padding: 14px 28px 16px 28px;
                flex-shrink: 0;
                width: 100%;
                box-sizing: border-box;
                text-align: center;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            footer p {
                font-size: 0.82rem;
                padding: 0;
                letter-spacing: 0.3px;
                text-align: center;
                margin: 0 auto;
                width: 100%;
                line-height: 1.45;
                overflow-wrap: break-word;
                word-wrap: break-word;
            }
        }
    </style>
</head>
<body>
    <header>
        <!-- Профиль по центру -->
        <div class="profile-block">
            <img src="avatar.png" alt="Bloody Romero" class="avatar">
            <div class="title-block">
                <h1>Bloody Romero</h1>
                <p class="subtitle">Илья Коростелёв</p>
            </div>
        </div>

        <!-- Соцсети абсолютно справа -->
        <div class="social-links">
            <a href="https://t.me/username" target="_blank" rel="noopener">
                <img src="tg.png" alt="Telegram" class="social-icon">
            </a>
            <a href="mailto:you@example.com">
                <img src="mail.png" alt="Email" class="social-icon">
            </a>
            <a href="https://youtube.com/@username" target="_blank" rel="noopener">
                <img src="yt.png" alt="YouTube" class="social-icon">
            </a>
        </div>
    </header>

    <div class="container">
        <div class="block musician">Музыкант</div>
        <div class="block arranger">Аранжировщик</div>
        <div class="block teacher">Преподаватель</div>
    </div>

    <footer>
        <p id="slogan-text"></p>
    </footer>

    <script>
        const slogans = [
            "Играю, аранжирую, учу. Иногда даже одновременно. Обычно — нет.",
            "Музыкант, аранжировщик, преподаватель. И да, я всё ещё жду, когда это станет прибыльным.",
            "Три пути, один человек. Выбирайте, но учтите: я всё равно буду вас учить, аранжировать и играть.",
            "Сайт собран на коленке. Как и большинство моих аранжировок. Но зато с душой.",
            "Здесь могла быть ваша реклама. Но я музыкант, а не маркетолог.",
            "Музыка — это не работа. Это диагноз.",
            "Этот сайт существует. Как и моя карьера. Пока что.",
            "Сделал сайт сам. Ну как сам — нейросеть помогала. Но идея моя. Честно.",
            "Музыкант, аранжировщик, преподаватель. А ещё умею печь хлеб.",
            "Синтез звука — это магия. Только с проводами и без жертвоприношений.",
            "Преподаватель, аранжировщик, музыкант. Три профессии, одна зарплата. Шучу. Зарплаты нет."
        ];
        document.getElementById('slogan-text').textContent = 
            slogans[Math.floor(Math.random() * slogans.length)];
    </script>
</body>
</html>
